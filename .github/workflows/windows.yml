name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-windows.sh'
      - '.github/workflows/windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build Windows executable
        env:
          PKG_CONFIG: /ucrt64/bin/pkg-config.exe
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: |
          # The Rust toolchain action installs Cargo under the Windows user profile.
          # Make that directory visible to the MSYS2 UCRT64 shell explicitly.
          export PATH="$(cygpath "$USERPROFILE")/.cargo/bin:$PATH"
          cargo --version
          rustc --version
          cargo build --release --target x86_64-pc-windows-gnu
      - name: Assemble portable package
        run: bash scripts/package-windows.sh
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Maze-Windows-Portable
          path: dist/Maze-Windows-Portable.zip
          if-no-files-found: error
